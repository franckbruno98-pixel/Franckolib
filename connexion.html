<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Franckolib - Connexion</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            <span>♡</span> Franckolib
        </div>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="medecins.html">Médecins</a>
            <a href="#">Services</a>
            <a href="connexion.html">Connexion</a>
        </nav>

    </header>


    <section class="connexion-page">

        <div class="connexion-container">

            <div class="connexion-image">

                <img
                    src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=900&q=85"
                    alt="Professionnel de santé"
                >

            </div>


            <div class="connexion-box">

                <div class="connexion-header">

                    <div class="connexion-logo">
                        ♡
                    </div>

                    <h1>
                        Bienvenue sur<br>
                        <span>Franckolib</span>
                    </h1>

                    <p>
                        Connectez-vous pour gérer vos rendez-vous
                        et accéder à votre espace patient.
                    </p>

                </div>


                <form id="connexionForm">

                    <div class="connexion-field">

                        <label for="email">
                            Adresse e-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="exemple@email.com"
                            required
                        >

                    </div>


                    <div class="connexion-field">

                        <div class="password-label">

                            <label for="motDePasse">
                                Mot de passe
                            </label>

                            <a href="#">
                                Mot de passe oublié ?
                            </a>

                        </div>

                        <div class="password-container">

                            <input
                                type="password"
                                id="motDePasse"
                                placeholder="Votre mot de passe"
                                required
                            >

                            <button
                                type="button"
                                id="voirMotDePasse"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="connexion-button"
                    >
                        Se connecter
                    </button>

                </form>


                <div class="connexion-separator">
                    <span>ou</span>
                </div>


                <button
                    type="button"
                    class="creation-button"
                    id="creerCompte"
                >
                    Créer un compte
                </button>

            </div>

        </div>

    </section>


    <script src="script-connexion.js"></script>

</body>

</html>
